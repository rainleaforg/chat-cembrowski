[project]
name = "chat-cembrowski"
version = "0.4.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=1.27.2.3",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "serpapi>=1.0.2",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.37.0",
    "voyageai>=0.3.2",
    "Pillow>=11.0.0",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.5",
    "asyncpg>=0.30.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
